        name: moya
    package: moya
    status: installed
    paths:
    - packages/moya/tools/aidevtracker.yaml
    spec:
      name: aidevtracker
      description: Track AI usage during software development
      scope: global
      lifecycle:
        install: $TOOL_DIR/scripts/aidevtracker/install.sh
        uninstall: $TOOL_DIR/scripts/aidevtracker/uninstall.sh
        status: $TOOL_DIR/scripts/aidevtracker/status.sh
        execute: $TOOL_DIR/scripts/aidevtracker/execute.sh
        version: $TOOL_DIR/scripts/aidevtracker/execute.sh version
      health:
        command: if command -v aidevtracker >/dev/null 2>&1; then aidevtracker version; elif [ -x "$HOME/.config/inditex/aidevtracker/bin/aidevtracker" ]; then "$HOME/.config/inditex/aidevtracker/bin/aidevtracker" version; else exit 1; fi
        expected: '*'
      goals:
        git-ai-upgrade:
          command: $TOOL_DIR/scripts/aidevtracker/execute.sh upgrade git-ai
          description: Check for updates and install latest version of git-ai
        git-ai-hooks-install:
          command: git-ai install-hooks
          description: Install git-ai hooks
        init:
          command: $TOOL_DIR/scripts/aidevtracker/execute.sh init
          description: Initialize aidevtracker in the current environment
        doctor:
          command: $TOOL_DIR/scripts/aidevtracker/execute.sh doctor
          description: Diagnose installation, wiring, and update health
        git-ai-hooks-uninstall:
          command: git-ai uninstall-hooks
          description: Remove git-ai hooks
        upgrade:
          command: $TOOL_DIR/scripts/aidevtracker/execute.sh upgrade
          description: Check for updates and install latest versions of all components
        git-ai-stats:
          command: git-ai stats
          description: Show AI authorship statistics
          scope: repo
        git-ai-log:
          command: git-ai log --oneline -20
          description: Show last 20 commits with AI authorship notes
          scope: repo
        git-ai-config:
          command: git-ai config
          description: Show current git-ai configuration
      status: installed
      healthy: true
    timestamp: '1785162456'
